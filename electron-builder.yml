appId: com.pluginpilot.app
productName: PluginPilot
directories:
  buildResources: build
# Only what the app runs: the built code and its icon. Dependencies are bundled into out/ by
# electron-vite, so node_modules, sources, docs and configs never end up in the app.
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
# The UI is English only, so drop Electron's other language packs.
electronLanguages:
  - en
win:
  executableName: pluginpilot
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: dmg
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
  # bzip2 compression: a smaller download than the default, at the cost of a slower first open.
  format: UDBZ
linux:
  target:
    - AppImage
    - deb
  maintainer: PluginPilot
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
