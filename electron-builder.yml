appId: com.pluginpilot.app
productName: PluginPilot
directories:
  buildResources: build
# Only what the app runs: the built code and its icon. Dependencies are bundled into out/ by
# electron-vite, so node_modules, sources, docs and configs never end up in the app.
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
# The UI is English only, so drop Electron's other language packs.
electronLanguages:
  - en
win:
  executableName: pluginpilot
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: dmg
  # Ad-hoc sign the whole bundle ("-"): there's no Developer ID, and without a complete signature
  # macOS reports a downloaded app as "damaged" instead of offering Open Anyway.
  identity: '-'
  # The hardened runtime is only needed for notarization, which needs a Developer ID. With an
  # ad-hoc signature it can stop Electron's frameworks from loading.
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
  # bzip2 here; `npm run build:mac` then converts it to LZMA (ULMO, macOS 10.15+), which is
  # smaller still but isn't a format electron-builder accepts.
  format: UDBZ
linux:
  target:
    - AppImage
    - deb
  maintainer: PluginPilot
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
