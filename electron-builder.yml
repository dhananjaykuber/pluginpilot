appId: com.pluginpilot.app
productName: PluginPilot
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,components.json}'
asarUnpack:
  - resources/**
# The UI is English only, so drop Electron's other language packs.
electronLanguages:
  - en
win:
  executableName: pluginpilot
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: dmg
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
  # bzip2 compression: a smaller download than the default, at the cost of a slower first open.
  format: UDBZ
linux:
  target:
    - AppImage
    - deb
  maintainer: PluginPilot
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
